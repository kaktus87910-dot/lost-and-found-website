services:
  - type: web
    name: lost-and-found-website
    runtime: python
    plan: starter
    rootDir: render_app
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --host 0.0.0.0 --port $PORT --store /var/data --model /var/data/models/yolov8n.onnx
    healthCheckPath: /api/health
    disk:
      name: lost-and-found-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
